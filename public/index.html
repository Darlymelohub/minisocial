<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniSocial</title>
<style>
:root{--bg:#0f0c1d;--card:#1a1530;--text:#f3f0ff;--mute:#a79fc4;--accent:#8b5cf6;--line:#2d2650;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,#2a1650 0%,#0f0c1d 45%) fixed;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:float 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:#8b5cf6;top:-80px;left:-80px}
.bg i:nth-child(2){width:300px;height:300px;background:#ec4899;bottom:-60px;right:-60px;animation-delay:-6s}
.bg i:nth-child(3){width:240px;height:240px;background:#f59e0b;top:45%;left:55%;animation-delay:-12s;opacity:.25}
.bg b{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.18);animation:rise linear infinite}
@keyframes float{to{transform:translate(60px,80px) scale(1.2)}}
@keyframes rise{to{transform:translateY(-110vh);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bg i,.bg b,.card{animation:none!important}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px}
.card{background:rgba(26,21,48,.8);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .4s ease both}
h1{font-size:28px;font-weight:800;margin:4px 0 12px;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
input,textarea,select{width:100%;padding:10px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.05);color:var(--text);font:inherit;margin-bottom:8px}
select option{background:#1a1530}
input:focus,textarea:focus,select:focus{outline:2px solid #8b5cf6}
button{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}
button.alt{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.12)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.who{display:flex;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin-right:10px;text-transform:uppercase}
.author{font-weight:600}.time,.mute{color:var(--mute);font-size:13px}
.post p{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
.err{color:#fb7185;font-size:14px;margin:0 0 8px}
.lang{padding:5px 12px;font-size:13px}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap" id="app"></div>
<script>
var T={
fr:{pseudo:'Pseudo',pass:'Mot de passe (4 caractères minimum)',country:'Pays',login:'Se connecter',signup:'Créer un compte',out:'Sortir',feed:'Fil',friends:'Amis',profile:'Profil',whats:'Quoi de neuf ?',publish:'Publier',nothing:'Rien pour l’instant. Publie ou ajoute des amis.',noOthers:'Aucun autre compte. Sors, crée un autre compte, puis reviens ici.',nobio:'Pas de bio',add:'Ajouter',remove:'Retirer',del:'Supprimer',bio:'Ta bio',save:'Enregistrer',fr:' ami(s)',po:' publication(s)',eFill:'Remplis le pseudo et le mot de passe.',eShort:'Mot de passe trop court.',eExists:'Ce pseudo existe déjà.',eNo:'Compte introuvable.',eBad:'Mot de passe incorrect.',eCountry:'Choisis ton pays.',now:'à l’instant',m:' min',h:' h',d:' j',hint:'Entre ton pseudo et ton mot de passe.'},
en:{pseudo:'Username',pass:'Password (4 characters minimum)',country:'Country',login:'Log in',signup:'Create account',out:'Log out',feed:'Feed',friends:'Friends',profile:'Profile',whats:'What’s new?',publish:'Post',nothing:'Nothing yet. Post something or add friends.',noOthers:'No other accounts. Log out, create another account, then come back.',nobio:'No bio',add:'Add',remove:'Remove',del:'Delete',bio:'Your bio',save:'Save',fr:' friend(s)',po:' post(s)',eFill:'Fill in username and password.',eShort:'Password too short.',eExists:'This username already exists.',eNo:'Account not found.',eBad:'Wrong password.',eCountry:'Choose your country.',now:'just now',m:' min',h:' h',d:' d',hint:'Enter your username and password.'}};
var C=['CD','CG','CM','CI','SN','GA','AO','NG','GH','KE','ZA','MA','DZ','TN','EG','HT','FR','BE','CH','CA','US','GB','DE','ES','PT','IT','BR','CN','JP','IN'];
T.fr.eNet='Erreur de connexion au serveur.';T.en.eNet='Could not reach the server.';
T.fr.eName='Pseudo : 2 à 20 lettres ou chiffres, sans espace ni accent.';T.en.eName='Username: 2–20 letters or digits, no spaces or accents.';
var S={me:null,tab:'feed',lang:'fr',posts:[],users:[]},U={err:'',n:'',c:''};
try{S.lang=localStorage.getItem('ms_lang')||'fr';}catch(e){}
function tok(v){try{if(v===undefined)return localStorage.getItem('ms_token');if(v)localStorage.setItem('ms_token',v);else localStorage.removeItem('ms_token');}catch(e){}}
function t(k){return T[S.lang][k];}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function flag(c){return c?c.replace(/./g,function(ch){return String.fromCodePoint(127397+ch.charCodeAt(0));}):'';}
function cname(c){try{return new Intl.DisplayNames([S.lang],{type:'region'}).of(c);}catch(e){return c;}}
function ago(x){var m=Math.floor((Date.now()-x)/60000);if(m<1)return t('now');if(m<60)return m+t('m');var h=Math.floor(m/60);if(h<24)return h+t('h');return Math.floor(h/24)+t('d');}
async function api(p,m,b){var r=await fetch('/api/'+p,{method:m||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(tok()||'')},body:b?JSON.stringify(b):undefined});var d={};try{d=await r.json();}catch(e){}if(!r.ok)throw d.error||'net';return d;}
async function load(){try{if(S.tab==='people')S.users=await api('users');else S.posts=await api('feed'+(S.tab==='profile'?'?mine=1':''));}catch(e){if(e==='auth'){tok(null);S.me=null;}}render();}
function setLang(l){S.lang=l;try{localStorage.setItem('ms_lang',l);}catch(e){}render();}
async function auth(mode){
 var n=document.getElementById('n').value.trim(),p=document.getElementById('p').value,c=document.getElementById('c').value;
 U.n=n;U.c=c;U.err='';
 if(!n||!p)U.err=t('eFill');else if(p.length<4)U.err=t('eShort');else if(mode==='signup'&&!c)U.err=t('eCountry');
 if(!U.err){try{var d=await api(mode,'POST',{name:n,password:p,country:c});tok(d.token);S.me=d.user;S.tab='feed';U.n=U.c='';await load();return;}catch(e){U.err={exists:t('eExists'),nouser:t('eNo'),badpass:t('eBad'),invalid:t('eName')}[e]||t('eNet');}}
 render();
}
function logout(){tok(null);S.me=null;render();}
async function post(){var x=document.getElementById('txt').value.trim();if(!x)return;try{await api('posts','POST',{text:x});}catch(e){}load();}
async function like(id){try{await api('posts/'+id+'/like','POST');}catch(e){}load();}
async function del(id){try{await api('posts/'+id,'DELETE');}catch(e){}load();}
async function friend(id){try{await api('friends/'+id,'POST');}catch(e){}load();}
async function bio(){var b=document.getElementById('bio').value;try{await api('me','PUT',{bio:b});S.me.bio=b;}catch(e){}render();}
function tab(x){S.tab=x;load();}
function postHtml(p){return '<div class="card post"><div class="row"><span class="who"><span class="av">'+esc(p.name.charAt(0))+'</span><span><div class="author">'+esc(p.name)+'</div><div class="mute">'+flag(p.country)+' '+esc(cname(p.country))+'</div></span></span><span class="time">'+ago(p.time)+'</span></div><p>'+esc(p.text)+'</p><div class="row"><button class="alt" onclick="like('+p.id+')">👍 '+p.likes+(p.liked?' ✓':'')+'</button>'+(p.name===S.me.name?'<button class="alt" onclick="del('+p.id+')">'+t('del')+'</button>':'')+'</div></div>';}
function langBtn(){return '<span><button class="alt lang" onclick="setLang(\''+(S.lang==='fr'?'en':'fr')+'\')">🌐 '+(S.lang==='fr'?'EN':'FR')+'</button></span>';}
function render(){
 var a=document.getElementById('app'),h='';
 document.documentElement.lang=S.lang;
 if(!S.me){
  var opts='<option value="">'+t('country')+'</option>'+C.map(function(c){return '<option value="'+c+'"'+(U.c===c?' selected':'')+'>'+flag(c)+' '+esc(cname(c))+'</option>';}).join('');
  h='<div class="row"><h1>MiniSocial</h1>'+langBtn()+'</div><div class="card"><p class="mute">'+t('hint')+'</p><input id="n" placeholder="'+t('pseudo')+'" value="'+esc(U.n)+'" autocomplete="username"><input id="p" type="password" placeholder="'+t('pass')+'" autocomplete="current-password"><select id="c">'+opts+'</select>'+(U.err?'<p class="err">'+U.err+'</p>':'')+'<div class="row"><button onclick="auth(\'login\')">'+t('login')+'</button><button class="alt" onclick="auth(\'signup\')">'+t('signup')+'</button></div></div>';
 }else{
  var u=S.me;
  h='<div class="row"><h1>MiniSocial</h1><div class="row"><span class="mute">'+flag(u.country)+' '+esc(u.name)+'</span>'+langBtn()+'<button class="alt lang" onclick="logout()">'+t('out')+'</button></div></div>';
  h+='<div class="tabs">'+[['feed','feed'],['people','friends'],['profile','profile']].map(function(x){return '<button class="'+(S.tab===x[0]?'':'alt')+'" onclick="tab(\''+x[0]+'\')">'+t(x[1])+'</button>';}).join('')+'</div>';
  if(S.tab==='feed'){
   h+='<div class="card"><textarea id="txt" rows="3" maxlength="500" placeholder="'+t('whats')+'"></textarea><button onclick="post()">'+t('publish')+'</button></div>';
   if(!S.posts.length)h+='<p class="mute">'+t('nothing')+'</p>';
   S.posts.forEach(function(p){h+=postHtml(p);});
  }else if(S.tab==='people'){
   if(!S.users.length)h+='<p class="mute">'+t('noOthers')+'</p>';
   S.users.forEach(function(x){h+='<div class="card row"><span class="who"><span class="av">'+esc(x.name.charAt(0))+'</span><span><div class="author">'+esc(x.name)+'</div><div class="mute">'+flag(x.country)+' '+esc(cname(x.country))+' · '+esc(x.bio||t('nobio'))+'</div></span></span><button class="'+(x.isFriend?'alt':'')+'" onclick="friend('+x.id+')">'+(x.isFriend?t('remove'):t('add'))+'</button></div>';});
  }else{
   h+='<div class="card"><div class="who"><span class="av">'+esc(u.name.charAt(0))+'</span><span><div class="author">'+esc(u.name)+'</div><div class="mute">'+flag(u.country)+' '+esc(cname(u.country))+'</div></span></div><p class="mute">'+S.posts.length+t('po')+'</p><textarea id="bio" rows="2" maxlength="200" placeholder="'+t('bio')+'">'+esc(u.bio||'')+'</textarea><button onclick="bio()">'+t('save')+'</button></div>';
   S.posts.forEach(function(p){h+=postHtml(p);});
  }
 }
 a.innerHTML=h;
}
(function(){var bg=document.querySelector('.bg');for(var i=0;i<14;i++){var b=document.createElement('b'),s=6+Math.random()*16;b.style.cssText='left:'+Math.random()*100+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(10+Math.random()*14)+'s;animation-delay:-'+Math.random()*20+'s';bg.appendChild(b);}})();
(async function(){if(tok()){try{S.me=await api('me');await load();return;}catch(e){tok(null);}}render();})();
</script>
</body>
  </html>
